<title>Hangar Debrief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bar-bg: rgba(10,13,16,0.82);
    --stripe-dark: rgba(0,0,0,0.55);
    --stripe-light: rgba(227,162,60,0.55);
    --divider: rgba(255,255,255,0.12);
    --text: #e7ebee;
    --text-dim: #9aa3ad;
    --good: #6fce7a;
    --bad: #e2584f;
    --reset-bg: #a93226;
    --reset-bg-hover: #c0392b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;}
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    font-family:'Teko','Segoe UI',sans-serif;
  }
  .bar{
    position:relative;
    width:328px;
    height:48px;
    display:flex;
    align-items:stretch;
    background:var(--bar-bg);
    border-top:1px solid rgba(255,255,255,0.10);
    overflow:hidden;
    cursor:default;
  }
  .bar::before{
    content:"";
    position:absolute;
    left:0; bottom:0;
    width:34px; height:34px;
    clip-path:polygon(0 100%, 0 40%, 60% 100%);
    background:repeating-linear-gradient(
      45deg,
      var(--stripe-dark) 0 6px,
      var(--stripe-light) 6px 12px
    );
    pointer-events:none;
  }
  .stats{
    position:relative;
    display:flex;
    align-items:center;
    flex:1 1 auto;
    padding-left:14px;
  }
  .stat{
    display:flex;
    align-items:center;
    gap:5px;
    padding:0 12px;
    border-left:1px solid var(--divider);
  }
  .stat:first-child{border-left:none;}
  .stat svg{
    width:15px;height:15px;
    flex:0 0 auto;
    color:var(--text-dim);
  }
  .stat .value{
    font-size:19px;
    font-weight:600;
    letter-spacing:0.01em;
    color:var(--text);
    font-variant-numeric:tabular-nums;
    transition:color 200ms ease;
  }
  .stat.winrate .value{color:var(--bad);}
  .stat.winrate.positive .value{color:var(--good);}
  .reset{
    position:relative;
    flex:0 0 36px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--reset-bg);
    border:none;
    border-left:1px solid rgba(0,0,0,0.3);
    color:#f3e7e5;
    cursor:pointer;
    transition:background 150ms ease;
  }
  .reset:hover{background:var(--reset-bg-hover);}
  .reset:focus-visible{outline:2px solid #fff; outline-offset:-2px;}
  .reset svg{width:16px;height:16px;}
  .flash{animation:pop 380ms ease;}
  @keyframes pop{
    0%{transform:scale(1);}
    40%{transform:scale(1.18);}
    100%{transform:scale(1);}
  }
  @media (prefers-reduced-motion: reduce){
    .flash{animation:none;}
    .reset{transition:none;}
  }
</style>

<div class="bar" id="bar" title="">
  <div class="stats">
    <div class="stat kills">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="7.5"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
      <span class="value" id="kills">0</span>
    </div>
    <div class="stat winrate" id="winrateStat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 3v18"/><path d="M5 4h12l-3 4 3 4H5"/></svg>
      <span class="value" id="winrate">0.00%</span>
    </div>
    <div class="stat deaths">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-9.6C5 7 7.1 5 9.7 5c1 0 2 .4 2.3 1.4L12 7l.3-1C12.9 5.4 13.7 5 14.3 5 16.9 5 19 7 19 10.4c0 1.4-.5 2.7-1.3 3.9"/><path d="M11 10l1.3-2 1.2 3-1.2 2 1.7 3"/></svg>
      <span class="value" id="deaths">0</span>
    </div>
  </div>
  <button class="reset" id="resetBtn" aria-label="Reset session" title="Reset session">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>
  </button>
</div>

<script>
(function(){
  var params = new URLSearchParams(location.search);
  var accountId = params.get('account_id') || 'DEMO-000000';
  var realm = (params.get('realm') || 'eu').toUpperCase();
  document.getElementById('bar').title = 'Account ' + accountId + ' • ' + realm + ' • demo data, not wired to WG API yet';

  var STORAGE_KEY = 'hangar-debrief-session-' + accountId;
  var state = load() || { kills: 0, deaths: 0, battles: 0, wins: 0 };

  function load(){
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch(e){ return null; }
  }
  function save(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
  }

  function flash(id){
    var el = document.getElementById(id);
    el.classList.remove('flash');
    void el.offsetWidth;
    el.classList.add('flash');
  }

  function render(changed){
    document.getElementById('kills').textContent = state.kills;
    document.getElementById('deaths').textContent = state.deaths;
    var wr = state.battles ? (state.wins / state.battles * 100) : 0;
    document.getElementById('winrate').textContent = wr.toFixed(2) + '%';
    document.getElementById('winrateStat').classList.toggle('positive', wr >= 50 && state.battles > 0);
    (changed || []).forEach(flash);
  }

  document.getElementById('resetBtn').addEventListener('click', function(){
    state = { kills: 0, deaths: 0, battles: 0, wins: 0 };
    save();
    render(['kills','winrate','deaths']);
  });

  render([]);

  function simulateBattle(){
    var win = Math.random() > 0.45;
    var kills = Math.random() > 0.35 ? Math.round(Math.random() * 3) : 0;
    var died = Math.random() > 0.4;
    state.battles += 1;
    state.wins += win ? 1 : 0;
    state.kills += kills;
    state.deaths += died ? 1 : 0;
    save();
    render(['kills','winrate','deaths']);
  }

  setTimeout(function(){
    simulateBattle();
    setInterval(simulateBattle, 7000 + Math.random() * 5000);
  }, 2000);
})();
</script>
