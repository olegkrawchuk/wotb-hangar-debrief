<meta charset="utf-8">
<title>Hangar Debrief</title>
<style>
  :root{
    --bar-bg: rgba(10,13,16,0.85);
    --stripe-dark: rgba(0,0,0,0.6);
    --stripe-light: rgba(227,162,60,0.6);
    --divider: rgba(255,255,255,0.14);
    --text: #f2f4f6;
    --text-dim: #8b95a1;
    --tier-avg: #f2f4f6;
    --tier-green: #57d93c;
    --tier-blue: #3aa7f0;
    --tier-purple: #b24ce0;
    --reset-bg: #a9281f;
    --reset-bg-hover: #c23026;
    --confirm-yes: #3aa13a;
    --confirm-yes-hover: #46bf46;
    --confirm-no: #a9281f;
    --confirm-no-hover: #c23026;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;}
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  }
  .bar{
    position:relative;
    width:328px;
    height:48px;
    background:var(--bar-bg);
    border-top:1px solid rgba(255,255,255,0.10);
    overflow:hidden;
  }
  .bar::before{
    content:"";
    position:absolute;
    left:0; bottom:0;
    width:34px; height:34px;
    clip-path:polygon(0 100%, 0 40%, 60% 100%);
    background:repeating-linear-gradient(45deg, var(--stripe-dark) 0 6px, var(--stripe-light) 6px 12px);
    pointer-events:none;
    z-index:0;
  }
  .view{
    position:absolute;
    inset:0;
    display:flex;
    align-items:stretch;
  }
  .stats{
    position:relative;
    display:flex;
    align-items:center;
    flex:1 1 auto;
    padding-left:14px;
    z-index:1;
  }
  .stat{
    display:flex;
    align-items:center;
    gap:6px;
    padding:0 13px;
    border-left:1px solid var(--divider);
    color:var(--text);
  }
  .stat:first-child{border-left:none;}
  .stat svg{
    width:16px;height:16px;
    flex:0 0 auto;
    color:inherit;
  }
  .stat .value{
    font-size:17px;
    font-weight:700;
    letter-spacing:0;
    color:inherit;
    font-variant-numeric:tabular-nums;
    transition:color 200ms ease;
  }
  .stat.winrate{color:var(--tier-avg);}
  .stat.winrate.t-green{color:var(--tier-green);}
  .stat.winrate.t-blue{color:var(--tier-blue);}
  .stat.winrate.t-purple{color:var(--tier-purple);}
  .reset{
    position:relative;
    z-index:1;
    flex:0 0 36px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--reset-bg);
    border:none;
    border-left:1px solid rgba(0,0,0,0.3);
    color:#f6eceb;
    cursor:pointer;
    transition:background 150ms ease;
  }
  .reset:hover{background:var(--reset-bg-hover);}
  .reset:focus-visible{outline:2px solid #fff; outline-offset:-2px;}
  .reset svg{width:17px;height:17px;}

  .confirm{
    display:none;
    align-items:stretch;
  }
  .confirm.active{display:flex;}
  .confirm-bg{
    position:absolute;
    inset:0;
    background:repeating-linear-gradient(45deg, #1a1d21 0 10px, #e3a23c 10px 20px);
    opacity:0.9;
  }
  .confirm-btn{
    position:relative;
    z-index:1;
    flex:0 0 42px;
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    cursor:pointer;
    transition:background 150ms ease;
  }
  .confirm-btn svg{width:18px;height:18px;}
  .confirm-btn.yes{background:var(--confirm-yes);}
  .confirm-btn.yes:hover{background:var(--confirm-yes-hover);}
  .confirm-btn.no{background:var(--confirm-no);}
  .confirm-btn.no:hover{background:var(--confirm-no-hover);}
  .confirm-text{
    position:relative;
    z-index:1;
    flex:1 1 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    color:#fff;
    font-weight:700;
    font-size:13px;
    text-shadow:0 1px 2px rgba(0,0,0,0.5);
    background:rgba(10,13,16,0.55);
  }
  .confirm-text svg{width:15px;height:15px;}

  .flash{animation:pop 380ms ease;}
  @keyframes pop{
    0%{transform:scale(1);}
    40%{transform:scale(1.16);}
    100%{transform:scale(1);}
  }
  @media (prefers-reduced-motion: reduce){
    .flash{animation:none;}
    .reset, .confirm-btn{transition:none;}
  }
</style>

<div class="bar" id="bar">
  <div class="view" id="statsView">
    <div class="stats">
      <div class="stat kills">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="7.5"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
        <span class="value" id="kills">0</span>
      </div>
      <div class="stat winrate" id="winrateStat">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M5 3h1.3v18H5z"/><path d="M6.3 4h11l-2.6 4 2.6 4h-11z"/></svg>
        <span class="value" id="winrate">0.00%</span>
      </div>
      <div class="stat dmg">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-9.6C5 7 7.1 5 9.7 5c1 0 2 .4 2.3 1.4L12 7l.3-1C12.9 5.4 13.7 5 14.3 5 16.9 5 19 7 19 10.4c0 1.4-.5 2.7-1.3 3.9"/><path d="M11 10l1.3-2 1.2 3-1.2 2 1.7 3"/></svg>
        <span class="value" id="dmg">0</span>
      </div>
    </div>
    <button class="reset" id="resetBtn" aria-label="Reset session" title="Reset session">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>
    </button>
  </div>
  <div class="view confirm" id="confirmView">
    <div class="confirm-bg"></div>
    <button class="confirm-btn yes" id="confirmYes" aria-label="Confirm reset">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>
    </button>
    <div class="confirm-text">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>
      Reset session data?
    </div>
    <button class="confirm-btn no" id="confirmNo" aria-label="Cancel reset">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
    </button>
  </div>
</div>

<script>
(function(){
  var params = new URLSearchParams(location.search);
  var realmRaw = params.get('realm') || '';
  // int64 values in this engine's expression language stringify with a
  // trailing "L" (e.g. literal defaults like "22272L" seen in shipped
  // YAML) - session.dbid is int64, so str(session.dbid) likely does too.
  var accountId = (params.get('account_id') || '').replace(/L$/i, '');
  var hasRealAccount = /^\d+$/.test(accountId);

  var bar = document.getElementById('bar');
  if (!hasRealAccount){
    bar.title = 'No account_id in URL - nothing to show';
    bar.querySelectorAll('.value').forEach(function(el){ el.textContent = '—'; });
    return;
  }
  bar.title = 'Account ' + accountId + ' • ' + realmRaw;

  var state = { kills: 0, dmg: 0, battles: 0, wins: 0 };

  function fmt(n){
    var s = Math.round(n).toString();
    return s.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  }

  function flash(id){
    var el = document.getElementById(id);
    el.classList.remove('flash');
    void el.offsetWidth;
    el.classList.add('flash');
  }

  function winrateTierClass(wr){
    if (wr >= 70) return 't-purple';
    if (wr >= 60) return 't-blue';
    if (wr >= 50) return 't-green';
    return '';
  }

  function render(changed){
    document.getElementById('kills').textContent = fmt(state.kills);
    var wr = state.battles ? (state.wins / state.battles * 100) : 0;
    document.getElementById('winrate').textContent = wr.toFixed(2) + '%';
    var wrStat = document.getElementById('winrateStat');
    wrStat.classList.remove('t-green', 't-blue', 't-purple');
    var tier = winrateTierClass(wr);
    if (tier) wrStat.classList.add(tier);
    var avgDmg = state.battles ? state.dmg / state.battles : 0;
    document.getElementById('dmg').textContent = fmt(avgDmg);
    (changed || []).forEach(flash);
  }

  var BASELINE_KEY = 'hangar-debrief-baseline-' + accountId;

  function loadBaseline(){
    try { return JSON.parse(localStorage.getItem(BASELINE_KEY)); } catch(e){ return null; }
  }
  function saveBaseline(b){
    try { localStorage.setItem(BASELINE_KEY, JSON.stringify(b)); } catch(e){}
  }

  function applyRealTotals(totals){
    var baseline = loadBaseline();
    if (!baseline){
      baseline = totals;
      saveBaseline(baseline);
    }
    state = {
      battles: totals.battles - baseline.battles,
      wins: totals.wins - baseline.wins,
      kills: totals.frags - baseline.frags,
      dmg: totals.damage_dealt - baseline.damage_dealt
    };
    render(['kills','winrate','dmg']);
  }

  function fetchRealStats(){
    fetch('/api/stats?account_id=' + encodeURIComponent(accountId) + '&realm=' + encodeURIComponent(realmRaw))
      .then(function(r){ return r.json(); })
      .then(function(json){
        if (!json || !json.ok || !json.wg || json.wg.status !== 'ok') return;
        var entry = json.wg.data && json.wg.data[accountId];
        if (!entry || !entry.statistics || !entry.statistics.all) return;
        applyRealTotals(entry.statistics.all);
      })
      .catch(function(){ /* transient network hiccup - keep last known values on screen */ });
  }

  var statsView = document.getElementById('statsView');
  var confirmView = document.getElementById('confirmView');

  document.getElementById('resetBtn').addEventListener('click', function(){
    confirmView.classList.add('active');
  });
  document.getElementById('confirmNo').addEventListener('click', function(){
    confirmView.classList.remove('active');
  });
  document.getElementById('confirmYes').addEventListener('click', function(){
    confirmView.classList.remove('active');
    localStorage.removeItem(BASELINE_KEY);
    fetchRealStats();
  });

  render([]);

  // The widget's whole page is reloaded by the game every time the hangar
  // screen is (re)shown, e.g. after a battle - that reload is the refresh
  // mechanism, so one fetch per page load is enough. No interval needed.
  fetchRealStats();
})();
</script>
